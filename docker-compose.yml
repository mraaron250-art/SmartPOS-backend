# Local development only (production runs on Render).
#   docker compose up --build      -> API on http://localhost:8000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartpos
      POSTGRES_USER: smartpos
      POSTGRES_PASSWORD: smartpos
    ports:
      - "5433:5432"   # host 5433 avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpos -d smartpos"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DATABASE_URL: postgres://smartpos:smartpos@db:5432/smartpos
      JWT_SECRET: local-dev-only-secret-change-me-0123456789abcdef
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PORT: "10000"
    ports:
      - "8000:10000"

volumes:
  pgdata:
