# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the API web service (built from ./Dockerfile on every push to main) and a PostgreSQL database.
services:
  - type: web
    name: smartpos-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DATABASE_URL
        fromDatabase:
          name: smartpos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel URL(s), comma-separated, e.g. https://smartpos-frontend.vercel.app
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: smartpos-db
    plan: free
    region: singapore
    databaseName: smartpos
    user: smartpos
    postgresMajorVersion: "17"
